# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
# Git Flow: version updates must land on develop (integration branch);
# Dependabot otherwise targets the default branch (main).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      dart-deps:
        patterns:
          - "*"
