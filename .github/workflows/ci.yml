# Continuous integration for the gewerber-mcp package.
#
#   - `dart pub get`
#   - `dart analyze` (must be clean)
#   - `dart test`   (unit tests, no live backend required)
#
# Triggers on every PR and on pushes to main. Make this check required in
# branch protection so merges always pass analyze + tests.
#
# No repository secrets are required. pubspec.yaml pulls the generated
# client from the public gewerber-backend repository (and the commercial
# stub packages); on develop-based runs the inter-repo refs are retargeted to
# `develop` (see tool/retarget_gewerber_refs.sh) so the pre-release toolchain
# chain stays resolvable; main keeps `ref: main`. Developers with private
# checkouts use a gitignored pubspec_overrides.yaml instead.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pubspec requires SDK ^3.13.3 (Dart 3.13.3, org-wide pin).
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      # Pre-release pairing: while the rc.2 chain lives only on develop
      # (release train not cut), pin the entire inter-repo web via
      # dependency_overrides — pub applies them across the whole resolution
      # graph, including the git-fetched gewerber_backend_client pubspec
      # (which still commits `ref: main` for the stubs; rewriting only local
      # pubspecs leaves that transitive requirement and pub fails with a
      # main-vs-develop source conflict). main runs keep `ref: main`.
      - name: Pair inter-repo deps with the target branch
        if: github.ref_name == 'develop' || github.base_ref == 'develop'
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          # Generated by CI — develop pairing (see comment in the step).
          dependency_overrides:
            gewerber_backend_client:
              git:
                url: https://github.com/Gewerber/gewerber-backend.git
                path: gewerber_backend_client
                ref: develop
            gewerber_backend_commercial_client:
              git:
                url: https://github.com/Gewerber/gewerber-backend-stubs.git
                path: gewerber_backend_commercial_client
                ref: develop
          EOF

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test
