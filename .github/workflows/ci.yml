# Continuous integration for the gewerber-mcp package.
#
#   - `dart pub get`
#   - `dart analyze` (must be clean)
#   - `dart test`   (unit tests, no live backend required)
#
# Triggers on every PR and on pushes to main. Make this check required in
# branch protection so merges always pass analyze + tests.
#
# No repository secrets are required. pubspec.yaml pulls the generated
# client from the public gewerber-backend repository (and the commercial
# stub packages); every run pins the inter-repo chain to its target branch
# (`main` or `develop`) so it stays resolvable — gewerber-backend commits
# `ref: develop` for the stubs and only retargets it inside its own CI.
# Developers with private checkouts use a gitignored pubspec_overrides.yaml
# instead.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pubspec requires SDK ^3.13.3 (Dart 3.13.3, org-wide pin).
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'

      # Pairing: every build pins the whole inter-repo chain to its target
      # branch. `pubspec.yaml` commits `ref: main` for both git deps, but
      # gewerber-backend commits `ref: develop` for the stubs and only
      # retargets that ref inside its own CI — so the committed refs cannot
      # resolve together on either branch. dependency_overrides apply across
      # the ENTIRE resolution graph, so pinning both deps here also overrides
      # the git-fetched gewerber_backend_client pubspec; rewriting only local
      # pubspecs would leave that transitive requirement and pub would fail on
      # the main-vs-develop source conflict.
      - name: Pair inter-repo deps with the target branch
        run: |
          set -euo pipefail
          # GITHUB_BASE_REF is set for pull_request only; for pushes it is
          # empty, so the branch comes from GITHUB_REF_NAME.
          target="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          case "$target" in
            main|develop) ;;
            *)
              echo "::error title=Unknown target branch::Cannot pair inter-repo deps to '$target'. Expected main or develop."
              exit 1
              ;;
          esac
          cat > pubspec_overrides.yaml <<EOF
          # Generated by CI — $target pairing (see comment in the step).
          dependency_overrides:
            gewerber_backend_client:
              git:
                url: https://github.com/Gewerber/gewerber-backend.git
                path: gewerber_backend_client
                ref: $target
            gewerber_backend_commercial_client:
              git:
                url: https://github.com/Gewerber/gewerber-backend-stubs.git
                path: gewerber_backend_commercial_client
                ref: $target
          EOF
          echo "pinned inter-repo deps to ref: $target"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test
