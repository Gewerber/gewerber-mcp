# Secret scanning for private repositories.
#
# GitHub-native secret scanning and push protection require Advanced Security
# on private repos, so this workflow is the free equivalent: TruffleHog scans
# the checked-out tree on every push to main/develop and on every PR, and the
# job fails when a VERIFIED secret is found.

name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan working tree for verified secrets
        run: |
          rm -rf .git
          docker run --rm -v "$PWD:/repo" -w /repo \
            trufflesecurity/trufflehog:latest \
            filesystem /repo --only-verified --no-update
